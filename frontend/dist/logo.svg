<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Locora logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#28a745"/>
      <stop offset="100%" stop-color="#20c997"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5f9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- three swirling petals -->
  <g transform="translate(256,256)">
    <path d="M0,-160 C90,-160 150,-100 160,-10 C70,-30 10,-20 0,-20 Z" fill="url(#g2)" transform="rotate(20) translate(0,30)" opacity="0.98" />
    <path d="M0,-160 C90,-160 150,-100 160,-10 C70,-30 10,-20 0,-20 Z" fill="url(#g1)" transform="rotate(140) translate(0,30)" opacity="0.98" />
    <path d="M0,-160 C90,-160 150,-100 160,-10 C70,-30 10,-20 0,-20 Z" fill="url(#g3)" transform="rotate(-100) translate(0,30)" opacity="0.98" />
    
    <!-- small house in center -->
    <g transform="translate(-28,-8)">
      <rect x="20" y="30" width="56" height="44" rx="6" fill="#08203a" />
      <polygon points="20,30 48,6 76,30" fill="#05324a" />
      <rect x="40" y="44" width="12" height="12" fill="#ffffff" opacity="0.95" />
      <rect x="56" y="44" width="12" height="12" fill="#ffffff" opacity="0.95" />
    </g>

  </g>

</svg>
